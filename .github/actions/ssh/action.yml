name: Configure SSH
description: Points the vps SSH host alias at the production server and sets DEPLOY_DIR

inputs:
  host:
    description: IP or host name of the server
    required: true
  port:
    description: SSH port
    required: false
    default: "22"
  user:
    description: User to connect as
    required: false
    default: deploy
  known-hosts:
    description: ssh-keyscan output for the server
    required: true
  private-key:
    description: Private key of the user
    required: true

runs:
  using: composite
  steps:
    - name: Configure SSH
      shell: bash
      env:
        DEPLOY_HOST: ${{ inputs.host }}
        DEPLOY_PORT: ${{ inputs.port }}
        DEPLOY_USER: ${{ inputs.user }}
        DEPLOY_KNOWN_HOSTS: ${{ inputs.known-hosts }}
        DEPLOY_SSH_KEY: ${{ inputs.private-key }}
      run: |
        missing=0
        for name in DEPLOY_HOST DEPLOY_KNOWN_HOSTS DEPLOY_SSH_KEY; do
          if [ -z "${!name}" ]; then
            echo "::error::$name is not set in the repository secrets"
            missing=1
          fi
        done
        if [ "$missing" = 1 ]; then
          exit 1
        fi

        install -d -m 700 ~/.ssh
        printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
        cat > ~/.ssh/config <<EOF
        Host vps
          HostName $DEPLOY_HOST
          Port ${DEPLOY_PORT:-22}
          User ${DEPLOY_USER:-deploy}
          IdentityFile ~/.ssh/deploy_key
          IdentitiesOnly yes
          StrictHostKeyChecking yes
          ServerAliveInterval 30
          ControlMaster auto
          ControlPath ~/.ssh/control-%C
          ControlPersist 15m
        EOF
        ssh vps true
        echo "DEPLOY_DIR=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
