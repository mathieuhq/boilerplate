name: Back up the database
description: Dumps the production database over SSH and uploads it to the backup R2 bucket

inputs:
  prefix:
    description: Start of the object key, followed by a UTC timestamp and .dump
    required: true
  account-id:
    description: Cloudflare account ID
    required: true
  bucket:
    description: Backup bucket name
    required: true
  access-key-id:
    description: R2 access key ID limited to the backup bucket
    required: true
  secret-access-key:
    description: R2 secret access key limited to the backup bucket
    required: true

outputs:
  key:
    description: Object key of the uploaded dump
    value: ${{ steps.upload.outputs.key }}

runs:
  using: composite
  steps:
    - name: Check backup secrets
      shell: bash
      env:
        R2_ACCOUNT_ID: ${{ inputs.account-id }}
        BACKUP_R2_BUCKET_NAME: ${{ inputs.bucket }}
        BACKUP_R2_ACCESS_KEY_ID: ${{ inputs.access-key-id }}
        BACKUP_R2_SECRET_ACCESS_KEY: ${{ inputs.secret-access-key }}
      run: |
        missing=0
        for name in R2_ACCOUNT_ID BACKUP_R2_BUCKET_NAME BACKUP_R2_ACCESS_KEY_ID BACKUP_R2_SECRET_ACCESS_KEY; do
          if [ -z "${!name}" ]; then
            echo "::error::$name is not set in the repository secrets"
            missing=1
          fi
        done
        if [ "$missing" = 1 ]; then
          exit 1
        fi

    - name: Dump database
      shell: bash
      run: |
        umask 077
        ssh vps "cd '$DEPLOY_DIR' && docker compose exec -T db sh -c 'pg_dump --username \"\$POSTGRES_USER\" --dbname \"\$POSTGRES_DB\" --format custom'" > "$RUNNER_TEMP/database.dump"
        test -s "$RUNNER_TEMP/database.dump"

    - name: Upload to R2
      id: upload
      shell: bash
      env:
        PREFIX: ${{ inputs.prefix }}
        R2_ACCOUNT_ID: ${{ inputs.account-id }}
        BACKUP_R2_BUCKET_NAME: ${{ inputs.bucket }}
        AWS_ACCESS_KEY_ID: ${{ inputs.access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.secret-access-key }}
        AWS_DEFAULT_REGION: auto
        AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      run: |
        key="$PREFIX$(date -u +%Y%m%dT%H%M%SZ).dump"
        aws s3 cp "$RUNNER_TEMP/database.dump" "s3://$BACKUP_R2_BUCKET_NAME/$key" \
          --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
          --only-show-errors
        echo "key=$key" >> "$GITHUB_OUTPUT"
        echo "Uploaded \`$key\` ($(du -h "$RUNNER_TEMP/database.dump" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
        rm -f "$RUNNER_TEMP/database.dump"
