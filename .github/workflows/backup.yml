name: Backup

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  enabled:
    name: Check backups are configured
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}

    steps:
      - name: Check backup bucket
        id: check
        env:
          BACKUP_R2_BUCKET_NAME: ${{ secrets.BACKUP_R2_BUCKET_NAME }}
        run: |
          if [ -n "$BACKUP_R2_BUCKET_NAME" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  backup:
    name: Back up the database to R2
    needs: enabled
    if: needs.enabled.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        uses: ./.github/actions/ssh
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          user: ${{ secrets.DEPLOY_USER }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Back up the database
        uses: ./.github/actions/backup
        with:
          prefix: postgres/
          account-id: ${{ secrets.R2_ACCOUNT_ID }}
          bucket: ${{ secrets.BACKUP_R2_BUCKET_NAME }}
          access-key-id: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
