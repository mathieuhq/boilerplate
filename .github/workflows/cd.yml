name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - AGENTS.md
      - CLAUDE.md
      - .agents/**
      - .claude/**
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to deploy, such as v1.2.3
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    name: Release
    needs: ci
    if: ${{ !cancelled() && (needs.ci.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.requested.outputs.version || steps.next.outputs.version }}

    steps:
      - name: Check requested version
        id: requested
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$VERSION is not a release tag such as v1.2.3"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.requested.outputs.version && format('refs/tags/{0}', steps.requested.outputs.version) || github.sha }}
          fetch-depth: 0

      - name: Check the release is on main
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.requested.outputs.version }}
        run: |
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$(git rev-parse HEAD)" --jq .status)"
          if [ "$status" != identical ] && [ "$status" != behind ]; then
            echo "::error::$VERSION points to a commit that is not on main"
            exit 1
          fi

      - name: Create release
        id: next
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          releases() {
            awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/' | sort -V
          }

          version="$(git tag --points-at HEAD | releases | tail -n 1)"
          if [ -z "$version" ]; then
            minimum="v$(jq -r .version package.json)"
            if ! [[ "$minimum" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::package.json version must be X.Y.Z, not ${minimum#v}"
              exit 1
            fi

            latest="$(git tag --list | releases | tail -n 1)"
            if [ -z "$latest" ]; then
              version="$minimum"
              echo "First release" > "$RUNNER_TEMP/notes.md"
            else
              IFS=. read -r major minor patch <<< "${latest#v}"
              version="$(printf '%s\n' "v$major.$minor.$((patch + 1))" "$minimum" | sort -V | tail -n 1)"
              git log --no-merges --format='- %s (%h)' "$latest..HEAD" > "$RUNNER_TEMP/notes.md"
            fi

            gh release create "$version" --target "$GITHUB_SHA" --title "$version" --notes-file "$RUNNER_TEMP/notes.md"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Released \`$version\`" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish container images
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha,scope=runtime

      - name: Publish migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: true
          tags: ${{ env.IMAGE_NAME }}-migrate:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha,scope=migrate

  deploy:
    name: Deploy to production
    needs: [release, publish]
    if: ${{ !cancelled() && needs.release.result == 'success' && (needs.publish.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      VERSION: ${{ needs.release.outputs.version }}
      DOMAIN: ${{ secrets.DOMAIN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.release.outputs.version }}

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Write environment file
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'boilerplate' }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'boilerplate' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_ADMIN_EMAIL: ${{ secrets.BETTER_AUTH_ADMIN_EMAIL }}
          BETTER_AUTH_TRUSTED_ORIGINS: ${{ secrets.BETTER_AUTH_TRUSTED_ORIGINS }}
          OAUTH_GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          OAUTH_GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
          EMAIL_API_BASE_URL: ${{ secrets.EMAIL_API_BASE_URL }}
          EMAIL_CONTACT_LIST_ID: ${{ secrets.EMAIL_CONTACT_LIST_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          missing=0
          for name in DOMAIN POSTGRES_PASSWORD REDIS_PASSWORD BETTER_AUTH_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in the repository secrets"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            exit 1
          fi

          if ! [[ "$DOMAIN" =~ ^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$ ]]; then
            echo "::error::DOMAIN must be a bare host name such as app.example.com"
            exit 1
          fi

          write() {
            case "$2" in
              *"'"* | *$'\n'*)
                echo "::error::$1 must not contain a single quote or a line break"
                return 1
                ;;
            esac
            printf "%s='%s'\n" "$1" "$2"
          }

          umask 077
          {
            write COMPOSE_PROFILES proxy
            write IMAGE_NAME "$IMAGE_NAME"
            write IMAGE_TAG "$VERSION"
            write DOMAIN "$DOMAIN"
            write TRUSTED_IP_HEADER x-forwarded-for
            write POSTGRES_USER "$POSTGRES_USER"
            write POSTGRES_DB "$POSTGRES_DB"
            write POSTGRES_PASSWORD "$POSTGRES_PASSWORD"
            write REDIS_PASSWORD "$REDIS_PASSWORD"
            write BETTER_AUTH_URL "https://$DOMAIN"
            write BETTER_AUTH_SECRET "$BETTER_AUTH_SECRET"
            write BETTER_AUTH_ADMIN_EMAIL "$BETTER_AUTH_ADMIN_EMAIL"
            write BETTER_AUTH_TRUSTED_ORIGINS "$BETTER_AUTH_TRUSTED_ORIGINS"
            write GITHUB_CLIENT_ID "$OAUTH_GITHUB_CLIENT_ID"
            write GITHUB_CLIENT_SECRET "$OAUTH_GITHUB_CLIENT_SECRET"
            write GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID"
            write GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET"
            write EMAIL_FROM "$EMAIL_FROM"
            write EMAIL_API_KEY "$EMAIL_API_KEY"
            write EMAIL_API_BASE_URL "$EMAIL_API_BASE_URL"
            write EMAIL_CONTACT_LIST_ID "$EMAIL_CONTACT_LIST_ID"
            write R2_ACCOUNT_ID "$R2_ACCOUNT_ID"
            write R2_BUCKET_NAME "$R2_BUCKET_NAME"
            write R2_ACCESS_KEY_ID "$R2_ACCESS_KEY_ID"
            write R2_SECRET_ACCESS_KEY "$R2_SECRET_ACCESS_KEY"
          } > "$RUNNER_TEMP/production.env"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check images exist
        run: |
          docker buildx imagetools inspect "$IMAGE_NAME:$VERSION" > /dev/null
          docker buildx imagetools inspect "$IMAGE_NAME-migrate:$VERSION" > /dev/null

      - name: Configure SSH
        id: ssh
        uses: ./.github/actions/ssh
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          user: ${{ secrets.DEPLOY_USER }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Check the database volume
        id: previous
        run: |
          volume="$(docker compose config --no-interpolate --format json | jq -r '.volumes["db-data"].name')"

          if ! ssh vps "test -f '$DEPLOY_DIR/.env'"; then
            echo "First deploy: PostgreSQL starts with an empty \`$volume\` volume" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! ssh vps "docker volume inspect '$volume'" > /dev/null; then
            echo "::error::The server was deployed before but has no $volume volume, so this deploy would start on an empty database. Nothing was changed: restore the volume, or the db-data volume name in compose.yaml, then deploy again."
            exit 1
          fi

          previous="$(ssh vps "grep '^IMAGE_TAG=' '$DEPLOY_DIR/.env'" | sed -n "s/^IMAGE_TAG='\(.*\)'$/\1/p")"
          if [ -z "$previous" ]; then
            echo "::error::Could not read the deployed version from the server's .env"
            exit 1
          fi
          echo "version=$previous" >> "$GITHUB_OUTPUT"

      - name: Back up the database before migrating
        if: steps.previous.outputs.version != ''
        uses: ./.github/actions/backup
        with:
          prefix: postgres/pre-deploy/${{ env.VERSION }}-
          account-id: ${{ secrets.R2_ACCOUNT_ID }}
          bucket: ${{ secrets.BACKUP_R2_BUCKET_NAME }}
          access-key-id: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}

      - name: Keep the deployed configuration
        id: snapshot
        if: steps.previous.outputs.version != ''
        run: ssh vps "cd '$DEPLOY_DIR' && rm -rf .previous && mkdir -m 700 .previous && cp -p compose.yaml .env .previous/ && cp -pR caddy .previous/"

      - name: Upload configuration
        run: |
          ssh vps "mkdir -p '$DEPLOY_DIR/caddy'"
          scp -q compose.yaml "vps:$DEPLOY_DIR/compose.yaml"
          scp -q caddy/Caddyfile "vps:$DEPLOY_DIR/caddy/Caddyfile"
          scp -q "$RUNNER_TEMP/production.env" "vps:$DEPLOY_DIR/.env"
          ssh vps "chmod 600 '$DEPLOY_DIR/.env'"

      - name: Pull images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh vps "docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin"
          ssh vps "cd '$DEPLOY_DIR' && docker compose pull --quiet"

      - name: Start stack
        run: |
          ssh vps "cd '$DEPLOY_DIR' && docker compose up --detach --no-build --wait --wait-timeout 300 --remove-orphans app proxy"
          ssh vps "cd '$DEPLOY_DIR' && docker compose exec -T proxy caddy reload --config /etc/caddy/Caddyfile"

      - name: Check health endpoint
        run: curl --fail --silent --show-error --max-time 10 --retry 20 --retry-delay 3 --retry-all-errors "https://$DOMAIN/api/health"

      - name: Remove unused images
        run: ssh vps "docker image prune --all --force" > /dev/null

      - name: Show logs
        if: failure() && steps.ssh.outcome == 'success'
        run: ssh vps "cd '$DEPLOY_DIR' && docker compose logs --tail 200"

      - name: Roll back to the previous release
        if: failure() && steps.snapshot.outcome == 'success'
        env:
          PREVIOUS_VERSION: ${{ steps.previous.outputs.version }}
        run: |
          ssh vps "cd '$DEPLOY_DIR' && cp -p .previous/compose.yaml .previous/.env . && rm -rf caddy && cp -pR .previous/caddy ."
          ssh vps "cd '$DEPLOY_DIR' && docker compose up --detach --no-build --pull missing --wait --wait-timeout 300 --remove-orphans app proxy"
          ssh vps "cd '$DEPLOY_DIR' && docker compose exec -T proxy caddy reload --config /etc/caddy/Caddyfile"
          curl --fail --silent --show-error --max-time 10 --retry 20 --retry-delay 3 --retry-all-errors "https://$DOMAIN/api/health"
          echo "::error::$VERSION failed to deploy, so $PREVIOUS_VERSION was put back"
          echo "Rolled back to \`$PREVIOUS_VERSION\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of GitHub Container Registry
        if: always() && steps.ssh.outcome == 'success'
        run: ssh vps "docker logout ghcr.io"
