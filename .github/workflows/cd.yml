name: CD

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to deploy, such as v1.2.3
        type: string
        required: true

permissions:
  contents: read

jobs:
  release:
    name: Check release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check version format
        id: version
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$VERSION is not a release tag such as v1.2.3"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.version.outputs.version }}

      - name: Check package version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          package_version="v$(jq -r .version package.json)"
          if [ "$package_version" != "$VERSION" ]; then
            echo "::error::package.json is at $package_version but the tag is $VERSION, release with pnpm version"
            exit 1
          fi

      - name: Check the release is on main
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$(git rev-parse HEAD)" --jq .status)"
          if [ "$status" != identical ] && [ "$status" != behind ]; then
            echo "::error::$VERSION points to a commit that is not on main"
            exit 1
          fi

  ci:
    name: CI
    needs: release
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    name: Publish container images
    needs: [release, ci]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha,scope=runtime

      - name: Publish migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: true
          tags: ${{ env.IMAGE_NAME }}-migrate:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha,scope=migrate

  deploy:
    name: Deploy to production
    needs: [release, publish]
    if: ${{ !cancelled() && needs.release.result == 'success' && (needs.publish.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.release.outputs.version }}
      DOMAIN: ${{ secrets.DOMAIN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.release.outputs.version }}

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Write environment file
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'boilerplate' }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'boilerplate' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_ADMIN_EMAIL: ${{ secrets.BETTER_AUTH_ADMIN_EMAIL }}
          BETTER_AUTH_TRUSTED_ORIGINS: ${{ secrets.BETTER_AUTH_TRUSTED_ORIGINS }}
          OAUTH_GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          OAUTH_GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
          EMAIL_API_BASE_URL: ${{ secrets.EMAIL_API_BASE_URL }}
          EMAIL_CONTACT_LIST_ID: ${{ secrets.EMAIL_CONTACT_LIST_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          missing=0
          for name in DOMAIN POSTGRES_PASSWORD REDIS_PASSWORD BETTER_AUTH_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in the repository secrets"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            exit 1
          fi

          if ! [[ "$DOMAIN" =~ ^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$ ]]; then
            echo "::error::DOMAIN must be a bare host name such as app.example.com"
            exit 1
          fi

          write() {
            case "$2" in
              *"'"* | *$'\n'*)
                echo "::error::$1 must not contain a single quote or a line break"
                return 1
                ;;
            esac
            printf "%s='%s'\n" "$1" "$2"
          }

          umask 077
          {
            write COMPOSE_PROFILES proxy
            write IMAGE_NAME "$IMAGE_NAME"
            write IMAGE_TAG "$VERSION"
            write DOMAIN "$DOMAIN"
            write TRUSTED_IP_HEADER x-forwarded-for
            write POSTGRES_USER "$POSTGRES_USER"
            write POSTGRES_DB "$POSTGRES_DB"
            write POSTGRES_PASSWORD "$POSTGRES_PASSWORD"
            write REDIS_PASSWORD "$REDIS_PASSWORD"
            write BETTER_AUTH_URL "https://$DOMAIN"
            write BETTER_AUTH_SECRET "$BETTER_AUTH_SECRET"
            write BETTER_AUTH_ADMIN_EMAIL "$BETTER_AUTH_ADMIN_EMAIL"
            write BETTER_AUTH_TRUSTED_ORIGINS "$BETTER_AUTH_TRUSTED_ORIGINS"
            write GITHUB_CLIENT_ID "$OAUTH_GITHUB_CLIENT_ID"
            write GITHUB_CLIENT_SECRET "$OAUTH_GITHUB_CLIENT_SECRET"
            write GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID"
            write GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET"
            write EMAIL_FROM "$EMAIL_FROM"
            write EMAIL_API_KEY "$EMAIL_API_KEY"
            write EMAIL_API_BASE_URL "$EMAIL_API_BASE_URL"
            write EMAIL_CONTACT_LIST_ID "$EMAIL_CONTACT_LIST_ID"
            write R2_ACCOUNT_ID "$R2_ACCOUNT_ID"
            write R2_BUCKET_NAME "$R2_BUCKET_NAME"
            write R2_ACCESS_KEY_ID "$R2_ACCESS_KEY_ID"
            write R2_SECRET_ACCESS_KEY "$R2_SECRET_ACCESS_KEY"
          } > "$RUNNER_TEMP/production.env"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check images exist
        run: |
          docker buildx imagetools inspect "$IMAGE_NAME:$VERSION" > /dev/null
          docker buildx imagetools inspect "$IMAGE_NAME-migrate:$VERSION" > /dev/null

      - name: Configure SSH
        id: ssh
        uses: ./.github/actions/ssh
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          user: ${{ secrets.DEPLOY_USER }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Upload configuration
        run: |
          ssh vps "mkdir -p '$DEPLOY_DIR/caddy'"
          scp -q compose.yaml "vps:$DEPLOY_DIR/compose.yaml"
          scp -q caddy/Caddyfile "vps:$DEPLOY_DIR/caddy/Caddyfile"
          scp -q "$RUNNER_TEMP/production.env" "vps:$DEPLOY_DIR/.env"
          ssh vps "chmod 600 '$DEPLOY_DIR/.env'"

      - name: Pull images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh vps "docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin"
          ssh vps "cd '$DEPLOY_DIR' && docker compose pull --quiet"

      - name: Start stack
        run: |
          ssh vps "cd '$DEPLOY_DIR' && docker compose up --detach --no-build --wait --wait-timeout 300 --remove-orphans app proxy"
          ssh vps "cd '$DEPLOY_DIR' && docker compose exec -T proxy caddy reload --config /etc/caddy/Caddyfile"

      - name: Check health endpoint
        run: curl --fail --silent --show-error --max-time 10 --retry 20 --retry-delay 3 --retry-all-errors "https://$DOMAIN/api/health"

      - name: Remove unused images
        run: ssh vps "docker image prune --all --force" > /dev/null

      - name: Show logs
        if: failure() && steps.ssh.outcome == 'success'
        run: ssh vps "cd '$DEPLOY_DIR' && docker compose logs --tail 200"

      - name: Log out of GitHub Container Registry
        if: always() && steps.ssh.outcome == 'success'
        run: ssh vps "docker logout ghcr.io"
