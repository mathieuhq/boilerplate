name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - AGENTS.md
      - CLAUDE.md
      - .agents/**
      - .claude/**

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    name: Deploy with Coolify
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger the Coolify deployment
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          missing=0
          for name in COOLIFY_WEBHOOK COOLIFY_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in the repository secrets"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            exit 1
          fi

          curl --fail --silent --show-error --max-time 30 \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_WEBHOOK"
