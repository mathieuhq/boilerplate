name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    name: Format, Lint, TypeCheck, Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate
        env:
          DATABASE_URL: postgresql://localhost:5432/ci

      - name: Check formatting
        run: pnpm prettier --check .

      - name: Lint
        run: pnpm eslint .

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Run tests
        run: pnpm test:run

  image:
    name: Build and smoke test container images
    needs: ci
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
      POSTGRES_DB: ci
      REDIS_PASSWORD: ${{ secrets.CI_REDIS_PASSWORD }}
      BETTER_AUTH_SECRET: ${{ secrets.CI_BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - name: Check smoke test secrets
        run: |
          missing=0
          for name in POSTGRES_PASSWORD REDIS_PASSWORD BETTER_AUTH_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::CI_$name is not set in the repository secrets"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name and tag
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          load: true
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

      - name: Build migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          tags: ${{ env.IMAGE_NAME }}-migrate:${{ env.IMAGE_TAG }}
          load: true
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

      - name: Start stack
        run: docker compose up --detach --no-build --wait --wait-timeout 120 app proxy

      - name: Check health endpoint
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3000/api/health
          curl --fail --silent --show-error --insecure --retry 5 --retry-all-errors https://localhost/api/health

      - name: Check graceful shutdown
        run: |
          docker compose stop app
          test "$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps --all --quiet app)")" = 0

      - name: Show logs
        if: failure()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: docker compose down --volumes
