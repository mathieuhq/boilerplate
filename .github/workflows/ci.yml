name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    name: Format, Lint, TypeCheck, Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate
        env:
          DATABASE_URL: postgresql://localhost:5432/ci

      - name: Check formatting
        run: pnpm oxfmt --check

      - name: Lint
        run: pnpm oxlint

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Run tests with coverage
        run: pnpm test:coverage

  image:
    name: Build and smoke test container images
    needs: ci
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
      POSTGRES_DB: ci
      REDIS_PASSWORD: ${{ secrets.CI_REDIS_PASSWORD }}
      BETTER_AUTH_SECRET: ${{ secrets.CI_BETTER_AUTH_SECRET }}

    steps:
      - name: Check smoke test secrets
        run: |
          missing=0
          for name in POSTGRES_PASSWORD REDIS_PASSWORD BETTER_AUTH_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::CI_$name is not set in the repository secrets"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          tags: boilerplate:ci
          load: true
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

      - name: Build migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          tags: boilerplate-migrate:ci
          load: true
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

      - name: Check the Coolify stack
        env:
          DATABASE_URL: postgresql://ci@db:5432/ci
          REDIS_URL: redis://redis:6379
          BETTER_AUTH_URL: http://localhost:3000
        run: yq 'del(.services[].exclude_from_hc)' compose.production.yaml | docker compose --project-directory . --file - config --quiet

      - name: Start PostgreSQL and Redis
        run: docker compose --file compose.dev.yaml up --detach --wait --wait-timeout 120

      - name: Run migrations
        run: |
          docker run --rm --network boilerplate_default \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            --env DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@db:5432/$POSTGRES_DB" \
            boilerplate-migrate:ci

      - name: Start app
        run: |
          docker run --detach --name app --network boilerplate_default --publish 127.0.0.1:3000:3000 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            --env DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@db:5432/$POSTGRES_DB" \
            --env REDIS_URL="redis://:$REDIS_PASSWORD@redis:6379" \
            --env BETTER_AUTH_URL=http://localhost:3000 \
            --env BETTER_AUTH_SECRET \
            --env TRUSTED_IP_HEADER=x-forwarded-for \
            boilerplate:ci

      - name: Check health endpoint
        run: curl --fail --silent --show-error --max-time 10 --retry 20 --retry-delay 3 --retry-all-errors http://127.0.0.1:3000/api/health

      - name: Check graceful shutdown
        run: |
          docker stop app
          test "$(docker inspect --format '{{.State.ExitCode}}' app)" = 0

      - name: Show logs
        if: failure()
        run: |
          docker logs app || true
          docker compose --file compose.dev.yaml logs

      - name: Stop stack
        if: always()
        run: |
          docker rm --force app || true
          docker compose --file compose.dev.yaml down --volumes
