services:
  migrate:
    build:
      context: .
      target: migrate
    restart: "no"
    exclude_from_hc: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      DATABASE_URL: ${DATABASE_URL:?}

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      REDIS_URL: ${REDIS_URL:?}
      DATABASE_URL: ${DATABASE_URL:?}

      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      BETTER_AUTH_ADMIN_EMAIL: ${BETTER_AUTH_ADMIN_EMAIL:-}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}

      TRUSTED_IP_HEADER: ${TRUSTED_IP_HEADER:-x-forwarded-for}

      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_API_BASE_URL: ${EMAIL_API_BASE_URL:-}
      EMAIL_CONTACT_LIST_ID: ${EMAIL_CONTACT_LIST_ID:-}

      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}

      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:?}
      STRIPE_TEAM_PRICE_ID: ${STRIPE_TEAM_PRICE_ID:?}
      STRIPE_TEAM_SEAT_PRICE_ID: ${STRIPE_TEAM_SEAT_PRICE_ID:?}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
