name: boilerplate

services:
  db:
    image: docker.io/library/postgres:alpine
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: docker.io/library/redis:alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?REDIS_PASSWORD is required}",
      ]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage:
    image: docker.io/chrislusf/seaweedfs:latest
    restart: unless-stopped
    command:
      [
        "mini",
        "-dir=/data",
        "-bucket=${R2_BUCKET_NAME:-boilerplate}",
        "-s3.allowedOrigins=${BETTER_AUTH_URL:-http://localhost:3000}",
        "-admin.ui=false",
        "-master.telemetry=false",
      ]
    environment:
      AWS_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-local-access-key}
      AWS_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-local-secret-key}
    ports:
      - "127.0.0.1:${STORAGE_PORT:-8333}:8333"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
    name: boilerplate_db-data
  redis-data:
    name: boilerplate_redis-data
  storage-data:
    name: boilerplate_storage-data
